<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script>
AFRAME.registerComponent('boundary', {
  schema: {
    minX: {default: -5},
    maxX: {default: 5},
    minZ: {default: -5},
    maxZ: {default: 5}
  },
  tick: function () {
    const pos = this.el.object3D.position;
    pos.x = Math.min(this.data.maxX, Math.max(this.data.minX, pos.x));
    pos.z = Math.min(this.data.maxZ, Math.max(this.data.minZ, pos.z));
  }
});
</script>
</head>
<body>
  <a-scene>
    <!-- Cámara -->
    <a-camera position="0 1.6 3"></a-camera>
  <a-entity camera look-controls wasd-controls boundary position="0 1.6 0"></a-entity>
    <!-- Plano con imagen transparente -->
    <a-plane
      position="0 1.5 -2"
      width="2"
      height="7"
      material="src: #miImagen; transparent: true; side: double; alphaTest: 0.5">
    </a-plane>
<a-plane
      position="0.5 1.5 -2.5"
      width="2"
      height="7"
      material="src: #miImagen; transparent: true; side: double; alphaTest: 0.5">
    </a-plane>
    <!-- Definir el asset de la imagen -->
    <a-assets>
      <img id="miImagen" src="botellatransp.png" crossorigin="anonymous">
    </a-assets>
<a-plane position="0 0 -4" rotation="-90 0 0" width="10" height="10" color="green"></a-plane>
    <!-- Fondo de referencia -->
    <a-sky color="#87CEEB"></a-sky>
  </a-scene>
</body>
</html>
